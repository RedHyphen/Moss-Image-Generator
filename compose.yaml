name: moss-image-generator

services:
  moss-image-generator-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-omni:nightly}
    network_mode: host
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${MOSS_HF_CACHE_DIR:-./data/models}:/root/.cache/huggingface
      - ${MOSS_TRITON_CACHE_DIR:-./data/triton}:/root/.triton
      - ./docker/vllm-entrypoint.sh:/opt/moss/vllm-entrypoint.sh:ro
    command:
      - vllm
      - serve
      - ${MOSS_MODEL:-OpenMOSS-Team/MOSS-Image-SFT}
      - --omni
      - --enforce-eager
      - --host
      - "127.0.0.1"
      - --port
      - "8001"
      - --served-model-name
      - ${MOSS_MODEL:-OpenMOSS-Team/MOSS-Image-SFT}
      - --dtype
      - ${VLLM_DTYPE:-float16}
      - --diffusion-offload-config
      - ${MOSS_VLLM_DIFFUSION_OFFLOAD_CONFIG:-{"mode":"layer","components":["dit","text_encoder"],"layer_options":{"dit":{"weight_transfer":"rank-local"},"text_encoder":{"weight_transfer":"rank-local"}},"pin_memory":true}
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
      - /root/.cache/flashinfer:size=1g,mode=1777
      - /root/.cache/vllm-omni:size=256m,mode=1777
    shm_size: 8gb
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/opt/moss/vllm-entrypoint.sh"]
    secrets:
      - vllm_api_key
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: moss-image-generator:local
    network_mode: host
    environment:
      MOSS_DATA_DIR: /var/lib/moss/data
      MOSS_MODELS_DIR: /var/lib/moss/data/models
      MOSS_STATIC_DIR: /opt/moss/frontend/dist
      MOSS_HOST: ${MOSS_HOST:-127.0.0.1}
      MOSS_PORT: ${MOSS_PORT:-8002}
      MOSS_TRUSTED_SUBNETS: ${MOSS_TRUSTED_SUBNETS:-}
      MOSS_LOCAL_ONLY: ${MOSS_LOCAL_ONLY:-true}
      MOSS_VLLM_URL: ${MOSS_VLLM_URL:-http://127.0.0.1:8001}
      MOSS_MODEL: ${MOSS_MODEL:-OpenMOSS-Team/MOSS-Image-SFT}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      MOSS_MAX_PIXELS: ${MOSS_MAX_PIXELS:-auto}
      MOSS_MAX_QUEUE: ${MOSS_MAX_QUEUE:-1}
      MOSS_ONLY_MODE: ${MOSS_ONLY_MODE:-true}
      MOSS_OFFLINE_MODE: ${MOSS_OFFLINE_MODE:-true}
      MOSS_CONTAINER_UID: ${MOSS_CONTAINER_UID:-1000}
    user: "${MOSS_CONTAINER_UID:-1000}:${MOSS_CONTAINER_GID:-1000}"
    volumes:
      - ./data:/var/lib/moss/data
    depends_on:
      - moss-image-generator-vllm
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /run:size=16m,mode=755
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

secrets:
  vllm_api_key:
    # This ignored file is generated by prepare_docker_env.sh. The entrypoint
    # extracts only VLLM_API_KEY before starting the worker.
    file: ${VLLM_API_KEY_FILE:-./.env.docker}
